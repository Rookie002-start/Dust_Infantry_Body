# Common settings for all projects
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_STD_CPP17=y
CONFIG_STATIC_INIT_GNU=y
CONFIG_THREAD_NAME=y

# ---- Main 线程栈（不够会直接死在启动阶段，别调小）------------------------
# main 的栈不只是 main() 自己用：启动框架（System_Startup → RunStage → 各 *_init）
# 都跑在它上面；而且 CONFIG_LOG_MODE_IMMEDIATE 下日志是"就地格式化"的，每打一行都要
# 在调用者栈上开消息缓冲，再走 log_output → cbprintf → RTT/UART 后端。
#
# 用 -fstack-usage 逐帧相加，这条链最深的一跳在 MidInit 的 chassis_init：
#   main 8 + System_Startup 8 + RunStage 48 + thread::chassis::thread_init 232
#   + 日志路径(z_log_msg 96 + log_output_msg 64 + log_output 80 + cbvprintf 144 + RTT ~50)
#   ≈ 1.0 KB；默认 1024 再扣掉 MPU 栈保护的 guard 就不够了。
# 现象：启动到 chassis_init、刚打完 "can ready" 就
#   MPU FAULT (Stacking error) → ZEPHYR FATAL ERROR 2: Stack overflow on CPU 0
# 所以这里给 2 KB（约一倍余量）。
CONFIG_MAIN_STACK_SIZE=2048

# 想量各线程真实的栈水位（升栈排查 / 给线程瘦身）就临时打开这组，
# 会每 10s 打一张 "thread / stack size / unused / usage" 表（多占一点 RAM+Flash）：
#CONFIG_THREAD_ANALYZER=y
#CONFIG_THREAD_ANALYZER_AUTO=y
#CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=10
#CONFIG_THREAD_ANALYZER_USE_PRINTK=y

CONFIG_SYS_CLOCK_TICKS_PER_SEC=2000
CONFIG_TICKLESS_KERNEL=n
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_ZBUS_PRIORITY_BOOST=n
CONFIG_DCACHE=n

# 项目级基础设施
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_MODE_IMMEDIATE=y

# ---- SEGGER RTT（实时日志 / 变量打印，走调试探针，不占串口）----------------
# 查看方法见 docs/segger_rtt.md；不需要时把 CONFIG_DEBUG_RTT 关掉即可。
CONFIG_DEBUG_RTT=y
# 上行缓冲（目标 -> 主机）：越大越不容易丢日志，代价是 RAM
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
# 下行缓冲（主机 -> 目标）：调试命令行靠它收命令（nc localhost 9090 里敲的字符），
# 32 字节一粘就截断，留 128
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=128
# SEGGER_RTT_printf() 的内部攒包缓冲
CONFIG_SEGGER_RTT_PRINTF_BUFFER_SIZE=128
# 通道 0 模式：主机没连 / 缓冲满时直接丢，绝不阻塞控制线程
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
# 日志后端缓冲满时覆盖最旧数据（另一个选择是 BLOCK，会阻塞线程，别用）
CONFIG_LOG_BACKEND_RTT_MODE_OVERWRITE=y

#VOFA+ 波形输出（TRD_VOFA = 只做初始化不建线程的所有者；业务线程只调 vofa::Send()）
CONFIG_TRD_VOFA=y

#调试命令行（tune ...）：RTT / 控制台串口收命令，在线调环调参，不用重烧
# 调参终端（modules/dbg）：RTT 里 pid <group> <axis> in|out <kp> <ki> 在线改双环 PID。
# 关掉时业务侧的 dbg::RegisterPid() 编译成空操作，业务线程照常独立跑（初值取各自常量）。
CONFIG_DBG=n

# 全局 -O2 优化，替代默认 -Os
CONFIG_SPEED_OPTIMIZATIONS=y

CONFIG_PRJ_MAIN=y

# ---- 看门狗监测 -------------------------------------------------------------
CONFIG_WDT_SUPERVISOR=y

# 项目算法层：单轴 LQR + ESO 云台力矩控制器（algorithm/lqr_eso/）
CONFIG_ALG_LQR_ESO=y

#业务线程开关
# CONFIG_TRD_TEST=y
# CONFIG_TRD_CAN=y

CONFIG_TRD_INTER_RX=y
CONFIG_TRD_MCU_INTER=y
CONFIG_TRD_CHASSIS=y
CONFIG_USE_POWERMETER=y
CONFIG_TRD_GIMBAL=y
CONFIG_TRD_GIMBAL_FB_IMU=y
